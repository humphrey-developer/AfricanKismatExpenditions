<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="contact.css">
</head>

<body>
    <header class="header">
      <div class="header-inner">
        <div class="header-logo">
          <span class="header-logo-main">African Kismat</span>
          <span class="header-logo-sub">Expeditions &bull; Est. 2010</span>
        </div>
        <button class="nav-toggle" aria-label="Toggle navigation">
          <span class="hamburger"></span>
        </button>
      </div>
    <nav>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About us</a></li>
        <li><a href="services.html">Services</a></li>
        <li><a href="destination.html">Destinations</a></li>
        <li><a href="contact.html" class="nav-cta">Plan a Trip</a></li>
      </ul>
    </nav>
    </header>
    <section id="contact">

        <div class="contact-hero">
            <h1>Contact Us<br>We'd love to hear from you!</h1>
        </div>

        <div class="contact-container">
            <h2>Contact Us</h2>
            <p>If you have any questions or inquiries, Feel free to reach out to us!</p>

            <form action="#" method="post">
                <label for="name">Name</label>
                <input type="text" id="name" name="name" required>

                <label for="email">Email</label>
                <input type="email" id="email" name="email" required>

                <label for="message">Message</label>
                <textarea id="message" name="message" required></textarea>

                <button type="submit">Send Message</button>
            </form>
        </div>
    </section>
    <footer>
        <p>Copyright African Kismat Expeditions, 2026 | All rights reserved.</p>
    </footer>    
    <script src="script.js"></script>
